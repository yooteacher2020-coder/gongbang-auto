name: 추천 상품 가져오기

on:
  schedule:
    - cron: '7 22,3,9 * * *'   # 매일 한국시간 7시 7분 · 12시 7분 · 18시 7분 (오늘 판매 순위 반영)
  workflow_dispatch: {}          # Actions 화면에서 "Run workflow"로 바로 실행
  repository_dispatch:
    types: [picks]               # 쇼츠공방 앱의 "지금 새로 가져오기" 버튼

permissions:
  contents: write

concurrency:
  group: picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 쿠팡 베스트·골드박스 가져오기
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: node scripts/picks.mjs
      - name: 저장
        run: |
          git config user.name "shortsgongbang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add picks.json picks-history.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "추천 상품 업데이트 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 5; done
          exit 1
